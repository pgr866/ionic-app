name: 'Test Report'
on:
  workflow_run:
    workflows: ['CI/CD Ionic']
    types: [completed]

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read
    steps:
      - uses: dorny/test-reporter@v3
        with:
          artifact: coverage
          name: Karma Tests
          path: 'test-results/test-results.xml'
          reporter: java-junit
